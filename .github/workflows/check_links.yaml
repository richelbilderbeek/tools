# Checks the Markdown files for broken links
name: check_links

on:
  push:
    paths:
      - .github/workflows/check_links.yaml
      - .github/workflows/valid_json_schema.json
      - mlc_config.json
      - '**.md'
  pull_request:
    paths:
      - .github/workflows/check_links.yaml
      - .github/workflows/valid_json_schema.json
      - mlc_config.json
      - '**.md'

jobs:
  check_links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The link checker will only work if mlc_config.json is a valid JSON
      - name: Validate JSON
        uses: docker://orrosenblatt/validate-json-action:latest
        env:
          INPUT_SCHEMA: .github/workflows/valid_json_schema.json
          INPUT_JSONS: mlc_config.json

      # If there is a valid external link that fails, add it to mlc_config.json
      - uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          config-file: 'mlc_config.json'
          use-quiet-mode: 'yes'
          use-verbose-mode: 'no'
